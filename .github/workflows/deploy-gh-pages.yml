name: Deploy Database Explorer to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional: reason for this deployment"
        required: false
        default: "Manual deployment"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install openpyxl

      - name: Generate static site
        run: |
          python .github/scripts/generate_site.py ObsDataPK_OSP.xlsx site/

      - name: Deploy to gh-pages branch
        run: |
          cd site/
          git init
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy PK database explorer [skip ci]"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
